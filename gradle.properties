org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# NOTE: this project needs a real JDK (with javac), and on some systems the default `java` is a
# JRE only. If Gradle reports "Toolchain installation ... does not provide the required
# capabilities: [JAVA_COMPILER]", point it at a JDK from your *user-level* properties file --
# ~/.gradle/gradle.properties -- rather than here, so the path stays out of version control:
#
#     org.gradle.java.home=/path/to/jdk-21
